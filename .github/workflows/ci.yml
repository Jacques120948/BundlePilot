name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bundlepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bundlepilot_test?schema=public
      SHOPIFY_API_KEY: test-key
      SHOPIFY_API_SECRET: test-secret
      SHOPIFY_APP_URL: https://example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate (test database)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (app + Shopify Functions)
        run: npm run test:all

      - name: Typecheck Shopify Functions
        run: |
          npx tsc --noEmit --project extensions/quantity-break-discount/tsconfig.json
          npx tsc --noEmit --project extensions/mix-match-cart-transform/tsconfig.json

      - name: Build
        run: npm run build
