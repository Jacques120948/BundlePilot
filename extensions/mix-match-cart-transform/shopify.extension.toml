api_version = "2026-07"

[[extensions]]
name = "BundlePilot: Mix & Match"
handle = "bundlepilot-mix-match"
type = "function"
uid = "3f6a9e1c-8b2d-4a77-9c1e-5d0b6a2f7e44"
description = "Merges a customer's valid Mix & Match / Grouped Mix & Match selection into one bundle line at checkout. Never trusts client-supplied discount data — see docs/CART_TRANSFORM.md."

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart-transform-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
  # `shopify app function typegen`'s built-in JS codegen path requires a
  # "codegen" block in this extension's package.json (undocumented outside
  # the CLI's own source); without one it fails hard rather than skipping.
  # src/../generated/api.ts is hand-maintained to match the input query in
  # cart_transform_run.graphql instead — see docs/CART_TRANSFORM.md
  # "Verification status". This no-op keeps `dev`/`build` from tripping
  # over that codegen requirement.
  typegen_command = "node -e process.exit(0)"
