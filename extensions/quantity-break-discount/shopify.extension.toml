api_version = "2026-07"

[[extensions]]
name = "BundlePilot: Quantity Break"
handle = "bundlepilot-quantity-break"
type = "function"
uid = "88c7ecd8-6220-4332-b92e-f7c729aa1597"
description = "Applies the merchant's quantity-break tiers to cart lines. Never trusts client-supplied discount data — see docs/DISCOUNT_ENGINE.md."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
  # `shopify app function typegen`'s built-in JS codegen path requires a
  # "codegen" block in this extension's package.json (undocumented outside
  # the CLI's own source); without one it fails hard rather than skipping.
  # src/../generated/api.ts is hand-maintained to match the input query in
  # cart_lines_discounts_generate_run.graphql instead — see
  # docs/DISCOUNT_ENGINE.md "Verification status". This no-op keeps
  # `dev`/`build` from tripping over that codegen requirement.
  typegen_command = "node -e process.exit(0)"
